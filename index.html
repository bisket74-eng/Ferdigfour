<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ferdig 4 - Twin Ops Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        comic: ['Bangers', 'cursive'],
                        body: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        navy: '#0b0f19',
                        eloise: '#9333ea',
                        amelia: '#16a34a'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .comic-border {
            border: 2px solid #334155;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .border-gradient-both {
            border: 2px solid transparent;
            background-clip: padding-box, border-box;
            background-origin: padding-box, border-box;
            background-image: linear-gradient(#020617, #020617), linear-gradient(to right, #9333ea, #16a34a);
        }
        
        /* Native Select Styling */
        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-100">

    <header class="bg-slate-900 border-b-2 border-amber-500 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-3 py-2">
            
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-11 h-11 bg-gradient-to-br from-red-600 to-amber-500 rounded-lg flex items-center justify-center text-black font-comic text-3xl transform -rotate-3 shadow-md border border-red-700">F4</div>
                    <div class="leading-none">
                        <h1 class="font-comic text-4xl text-amber-400 tracking-wide m-0 drop-shadow-md">FERDIG 4</h1>
                        <p class="text-[11px] text-slate-300 font-bold tracking-wider mt-0.5 uppercase">Ben, Megan, Eloise & Amelia</p>
                    </div>
                </div>

                <button onclick="openModal('sosModal')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-xs font-bold shadow-md flex items-center border border-red-400 comic-border active:scale-95 transition">
                    <i class="fa-solid fa-bullhorn mr-1 animate-pulse"></i> SOS
                </button>
            </div>

            <div class="mt-3 flex justify-center">
                <div class="flex items-center bg-slate-950 rounded-full p-1 border border-slate-700 w-full max-w-sm relative">
                    <button id="role-parents" onclick="setRole('parents')" class="flex-1 py-1.5 rounded-full text-sm font-bold transition-all bg-blue-600 text-white z-10 shadow-sm">
                        <i class="fa-solid fa-user-shield mr-1"></i>Parents
                    </button>
                    <button id="role-squad" onclick="setRole('squad')" class="flex-1 py-1.5 rounded-full text-sm font-bold transition-all text-slate-400 z-10">
                        <i class="fa-solid fa-users mr-1"></i>Ally Squad
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="bg-slate-900/90 border-b border-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-2 overflow-x-auto no-scrollbar flex space-x-2 py-2">
            <button onclick="switchTab('care')" id="tab-care" class="tab-btn bg-blue-600 text-white px-4 py-2 rounded-md font-bold text-sm whitespace-nowrap border border-blue-500 transition">Care Command</button>
            <button onclick="switchTab('memories')" id="tab-memories" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-md font-bold text-sm whitespace-nowrap border border-slate-700 transition">Memories</button>
            <button onclick="switchTab('grocery')" id="tab-grocery" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-md font-bold text-sm whitespace-nowrap border border-slate-700 transition">Grocery</button>
            <button id="tab-bills-nav" onclick="switchTab('bills')" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-md font-bold text-sm whitespace-nowrap border border-slate-700 transition parents-only">Bill Tracker</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto p-3 flex-grow w-full flex flex-col gap-3">

        <!-- ================= TAB: CARE COMMAND ================= -->
        <div id="view-care" class="view-section flex flex-col gap-3 w-full">
            
            <button id="toggle-log-btn" onclick="toggleLogForm()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 py-3.5 rounded-full font-bold text-base tracking-widest uppercase shadow-md transition-all border border-amber-500/50 flex items-center justify-center gap-2 active:scale-95">
                <i class="fa-solid fa-plus-circle text-lg"></i> <span>Log Action</span>
            </button>

            <div id="log-form-container" class="hidden bg-slate-900 p-3 rounded-xl border border-slate-700 shadow-lg transition-all">
                <form onsubmit="saveLog(event)" class="space-y-4">
                    
                    <!-- Twin Selector with Strict Colors -->
                    <div class="flex gap-1.5 bg-slate-950 p-1.5 rounded-full border border-slate-800">
                        <button type="button" onclick="setTarget('Eloise')" id="tgt-Eloise" class="tgt-btn flex-1 py-2.5 rounded-full text-sm font-bold text-slate-500 border border-transparent transition-all">Eloise</button>
                        <button type="button" onclick="setTarget('Amelia')" id="tgt-Amelia" class="tgt-btn flex-1 py-2.5 rounded-full text-sm font-bold text-slate-500 border border-transparent transition-all">Amelia</button>
                        <button type="button" onclick="setTarget('Both')" id="tgt-Both" class="tgt-btn flex-1 py-2.5 rounded-full text-sm font-bold text-slate-500 border border-transparent transition-all">Both</button>
                    </div>

                    <!-- Action Type Selector -->
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setAction('feed')" id="act-feed" class="act-btn flex flex-col items-center justify-center py-3 rounded-lg border-2 border-slate-700 bg-slate-950 text-slate-400 transition-all">
                            <i class="fa-solid fa-bottle-droplet text-2xl mb-1.5"></i>
                            <span class="text-[11px] font-bold uppercase tracking-wider">Feed</span>
                        </button>
                        <button type="button" onclick="setAction('diaper')" id="act-diaper" class="act-btn flex flex-col items-center justify-center py-3 rounded-lg border-2 border-slate-700 bg-slate-950 text-slate-400 transition-all">
                            <i class="fa-solid fa-baby-carriage text-2xl mb-1.5"></i>
                            <span class="text-[11px] font-bold uppercase tracking-wider">Diaper</span>
                        </button>
                        <button type="button" onclick="setAction('med')" id="act-med" class="act-btn flex flex-col items-center justify-center py-3 rounded-lg border-2 border-slate-700 bg-slate-950 text-slate-400 transition-all">
                            <i class="fa-solid fa-pills text-2xl mb-1.5"></i>
                            <span class="text-[11px] font-bold uppercase tracking-wider">Med</span>
                        </button>
                    </div>

                    <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-3">
                        
                        <!-- Native Time Picker -->
                        <div class="flex items-center bg-slate-900 rounded-md border border-slate-700 overflow-hidden">
                            <span class="px-3 text-slate-400"><i class="fa-regular fa-clock"></i></span>
                            <input type="time" id="log-time" class="flex-grow bg-transparent p-3 text-base text-white focus:outline-none" required>
                        </div>

                        <!-- FEED Inputs (Select Dial) -->
                        <div id="form-feed" class="dynamic-form flex items-center gap-2">
                            <select id="feed-amount" class="w-full bg-slate-900 border border-slate-700 rounded-md p-3 text-base text-white focus:border-blue-500 outline-none pr-8 cursor-pointer">
                                <!-- Options populated by JS -->
                            </select>
                            <span class="text-slate-400 text-sm px-2 font-bold">oz</span>
                        </div>

                        <!-- DIAPER Inputs (Quick Taps) -->
                        <div id="form-diaper" class="dynamic-form hidden flex gap-2">
                            <button type="button" id="diaper-wet" onclick="setDiaper('Wet')" class="flex-1 py-3 rounded-md border-2 border-slate-700 bg-slate-900 text-slate-400 font-bold text-base transition-all active:scale-95">Wet</button>
                            <button type="button" id="diaper-dirty" onclick="setDiaper('Dirty')" class="flex-1 py-3 rounded-md border-2 border-slate-700 bg-slate-900 text-slate-400 font-bold text-base transition-all active:scale-95">Dirty</button>
                            <input type="hidden" id="diaper-status" value="">
                        </div>

                        <!-- MED Inputs (Select Dial & Unit) -->
                        <div id="form-med" class="dynamic-form hidden space-y-3">
                            <div class="flex items-center gap-2">
                                <select id="med-amount" class="w-1/2 bg-slate-900 border border-slate-700 rounded-md p-3 text-base text-white focus:border-emerald-500 outline-none pr-8 cursor-pointer">
                                    <!-- Options populated by JS -->
                                </select>
                                <select id="med-unit" class="w-1/2 bg-slate-900 border border-slate-700 rounded-md p-3 text-base text-white focus:border-emerald-500 outline-none pr-8 cursor-pointer">
                                    <option value="ml">ml</option>
                                    <option value="tsp">tsp</option>
                                    <option value="oz">oz</option>
                                    <option value="mg">mg</option>
                                    <option value="drops">drops</option>
                                </select>
                            </div>
                            <input type="text" id="med-type" placeholder="Medication Name" class="w-full bg-slate-900 border border-slate-700 rounded-md p-3 text-base text-white focus:border-emerald-500 outline-none">
                        </div>

                        <!-- Notes Field with Web Speech API -->
                        <div class="flex items-center bg-slate-900 rounded-md border border-slate-700 focus-within:border-amber-500 transition-colors">
                            <input type="text" id="log-notes" placeholder="Notes (optional)" class="flex-grow bg-transparent p-3 text-sm text-white focus:outline-none">
                            <button type="button" onclick="startDictation('log-notes')" class="p-3 text-slate-400 hover:text-amber-400 transition-colors" title="Voice to Text">
                                <i class="fa-solid fa-microphone text-lg"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-lg text-base uppercase tracking-wider shadow-md comic-border transition-colors active:scale-95">Record Action</button>
                </form>
            </div>

            <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 flex flex-col flex-grow mt-1">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                    <h2 class="font-comic text-2xl text-white tracking-wide">LIVE ACTIVITY</h2>
                    <button onclick="openModal('clearLogsModal')" class="text-red-500 bg-red-950/30 hover:bg-red-900/50 px-3 py-1.5 rounded-md text-xs font-bold border border-red-900 transition"><i class="fa-solid fa-trash mr-1"></i>Clear</button>
                </div>
                <div id="logs-container" class="space-y-2.5 overflow-y-auto max-h-[65vh] pr-1 pb-4">
                    <!-- Logs populated via JS -->
                </div>
            </div>
        </div>

        <!-- ================= TAB: MEMORIES ================= -->
        <div id="view-memories" class="view-section hidden space-y-3">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center text-slate-400 py-10">
                <i class="fa-solid fa-camera text-4xl mb-3 text-slate-600"></i>
                <p>Memories module initializing...</p>
            </div>
        </div>

        <!-- ================= TAB: GROCERY ================= -->
        <div id="view-grocery" class="view-section hidden">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center text-slate-400 py-10">
                <i class="fa-solid fa-cart-shopping text-4xl mb-3 text-slate-600"></i>
                <p>Grocery list initializing...</p>
            </div>
        </div>

        <!-- ================= TAB: BILLS ================= -->
        <div id="view-bills" class="view-section hidden bg-slate-900 p-4 rounded-xl border border-slate-700 text-center text-slate-400 py-10 parents-only">
             <i class="fa-solid fa-file-invoice-dollar text-4xl mb-3 text-slate-600"></i>
             <p>Bill Tracker initializing...</p>
        </div>

    </main>

    <div id="sosModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border-2 border-red-500 p-5 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="font-comic text-3xl text-red-500 tracking-wide mb-4 text-center">SQUAD ASSIST SOS</h3>
            <p class="text-slate-300 text-sm mb-4 text-center">Send an alert to the Ally Squad.</p>
            <form onsubmit="event.preventDefault(); closeModal('sosModal');" class="space-y-3">
                <div class="flex gap-2 mt-4">
                    <button type="button" onclick="closeModal('sosModal')" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg text-sm">Acknowledge</button>
                    <button type="button" onclick="closeModal('sosModal')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg text-sm">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="clearLogsModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border-2 border-red-500 p-5 rounded-xl w-full max-w-sm shadow-2xl text-center">
            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-3"></i>
            <h3 class="font-comic text-3xl text-white tracking-wide mb-2">CLEAR ACTIVITY?</h3>
            <p class="text-slate-300 text-sm mb-5">This will permanently delete the live activity list.</p>
            <div class="flex gap-3">
                <button onclick="clearLogs()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg text-sm">Yes, Clear</button>
                <button onclick="closeModal('clearLogsModal')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <div id="dictationModal" class="fixed inset-0 bg-black/50 z-[110] hidden flex items-center justify-center pointer-events-none">
        <div class="bg-slate-900/95 border border-amber-500 p-6 rounded-xl flex flex-col items-center gap-3">
            <div class="text-amber-500 text-4xl animate-bounce"><i class="fa-solid fa-microphone"></i></div>
            <div class="text-white text-lg font-bold">Listening...</div>
        </div>
    </div>

    <script>
        // Default State with Persistence Tracking Variables
        let state = {
            role: 'parents',
            targetTwin: 'Both',
            actionType: 'feed',
            lastFeedAmt: '2.0',
            lastMedAmt: '1.0',
            lastMedUnit: 'ml',
            lastMedType: '',
            logs: []
        };

        // Initialize App
        window.onload = () => {
            populateSelectDials(); // Generate native select options 0.5 - 12.0

            const saved = localStorage.getItem('f4_state_v4');
            if (saved) {
                try { state = { ...state, ...JSON.parse(saved) }; } catch(e){}
            }
            
            setRole(state.role);
            setTarget(state.targetTwin);
            setAction(state.actionType);
            setCurrentTime();
            applyPersistedValues();
            renderLogs();
        };

        // Generate options for native mobile picker dials
        function populateSelectDials() {
            let optionsHTML = '';
            for (let i = 0.5; i <= 12.0; i += 0.5) {
                // Ensure nice formatting like "1.0", "1.5"
                const val = i.toFixed(1);
                optionsHTML += `<option value="${val}">${val}</option>`;
            }
            document.getElementById('feed-amount').innerHTML = optionsHTML;
            document.getElementById('med-amount').innerHTML = optionsHTML;
        }

        // Apply remembered form values
        function applyPersistedValues() {
            document.getElementById('feed-amount').value = state.lastFeedAmt || '2.0';
            document.getElementById('med-amount').value = state.lastMedAmt || '1.0';
            document.getElementById('med-unit').value = state.lastMedUnit || 'ml';
            document.getElementById('med-type').value = state.lastMedType || '';
        }

        function saveData() {
            localStorage.setItem('f4_state_v4', JSON.stringify(state));
            renderLogs();
        }

        function setRole(r) {
            state.role = r;
            const btnP = document.getElementById('role-parents');
            const btnS = document.getElementById('role-squad');
            
            if (r === 'parents') {
                btnP.className = "flex-1 py-1.5 rounded-full text-sm font-bold transition-all bg-blue-600 text-white z-10 shadow-sm";
                btnS.className = "flex-1 py-1.5 rounded-full text-sm font-bold transition-all text-slate-400 z-10 hover:text-slate-200";
                document.querySelectorAll('.parents-only').forEach(el => el.classList.remove('hidden'));
            } else {
                btnS.className = "flex-1 py-1.5 rounded-full text-sm font-bold transition-all bg-amber-500 text-black z-10 shadow-sm";
                btnP.className = "flex-1 py-1.5 rounded-full text-sm font-bold transition-all text-slate-400 z-10 hover:text-slate-200";
                document.querySelectorAll('.parents-only').forEach(el => el.classList.add('hidden'));
                
                if (!document.getElementById('view-bills').classList.contains('hidden')) {
                    switchTab('care');
                }
            }
            saveData();
        }

        function switchTab(tabId) {
            if (state.role === 'squad' && tabId === 'bills') return;
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
                el.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            const btn = document.getElementById(`tab-${tabId}`);
            btn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
            btn.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
        }

        function toggleLogForm() {
            const container = document.getElementById('log-form-container');
            const btn = document.getElementById('toggle-log-btn');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-minus-circle text-lg"></i> <span>Close Form</span>`;
                btn.classList.replace('bg-slate-800', 'bg-slate-700');
                btn.classList.replace('text-amber-400', 'text-slate-300');
                btn.classList.replace('border-amber-500/50', 'border-slate-500');
                setCurrentTime();
                applyPersistedValues(); // ensure fresh setup on open
            } else {
                container.classList.add('hidden');
                btn.innerHTML = `<i class="fa-solid fa-plus-circle text-lg"></i> <span>Log Action</span>`;
                btn.classList.replace('bg-slate-700', 'bg-slate-800');
                btn.classList.replace('text-slate-300', 'text-amber-400');
                btn.classList.replace('border-slate-500', 'border-amber-500/50');
            }
        }

        function setCurrentTime() {
            const now = new Date();
            const timeString = now.toTimeString().slice(0, 5); // Format HH:MM
            document.getElementById('log-time').value = timeString;
        }

        function setTarget(t) {
            state.targetTwin = t;
            document.querySelectorAll('.tgt-btn').forEach(el => {
                el.className = "tgt-btn flex-1 py-2.5 rounded-full text-sm font-bold text-slate-500 border border-transparent transition-all";
            });
            const btn = document.getElementById(`tgt-${t}`);
            // Applying strict styling per requirements
            if (t === 'Eloise') btn.className = "tgt-btn flex-1 py-2.5 rounded-full text-sm font-bold transition-all bg-purple-600 text-white shadow-md border-purple-400 scale-[1.02]";
            if (t === 'Amelia') btn.className = "tgt-btn flex-1 py-2.5 rounded-full text-sm font-bold transition-all bg-green-600 text-white shadow-md border-green-400 scale-[1.02]";
            if (t === 'Both') btn.className = "tgt-btn flex-1 py-2.5 rounded-full text-sm font-bold transition-all text-white shadow-md border-white/30 bg-gradient-to-r from-purple-600 to-green-600 scale-[1.02]";
        }

        function setAction(a) {
            state.actionType = a;
            
            document.querySelectorAll('.act-btn').forEach(el => {
                el.className = "act-btn flex flex-col items-center justify-center py-3 rounded-lg border-2 border-slate-700 bg-slate-950 text-slate-400 transition-all";
            });
            const btn = document.getElementById(`act-${a}`);
            if(a === 'feed') btn.className = "act-btn flex flex-col items-center justify-center py-3 rounded-lg border-2 border-blue-500 bg-blue-900/30 text-blue-400 transition-all scale-[1.03] shadow-md shadow-blue-900/30";
            if(a === 'diaper') btn.className = "act-btn flex flex-col items-center justify-center py-3 rounded-lg border-2 border-amber-500 bg-amber-900/30 text-amber-400 transition-all scale-[1.03] shadow-md shadow-amber-900/30";
            if(a === 'med') btn.className = "act-btn flex flex-col items-center justify-center py-3 rounded-lg border-2 border-emerald-500 bg-emerald-900/30 text-emerald-400 transition-all scale-[1.03] shadow-md shadow-emerald-900/30";

            document.querySelectorAll('.dynamic-form').forEach(el => el.classList.add('hidden'));
            if(a === 'feed') document.getElementById('form-feed').classList.remove('hidden');
            if(a === 'diaper') document.getElementById('form-diaper').classList.remove('hidden');
            if(a === 'med') document.getElementById('form-med').classList.remove('hidden');
        }

        function setDiaper(status) {
            document.getElementById('diaper-status').value = status;
            const wBtn = document.getElementById('diaper-wet');
            const dBtn = document.getElementById('diaper-dirty');
            
            wBtn.className = "flex-1 py-3 rounded-md border-2 border-slate-700 bg-slate-900 text-slate-400 font-bold text-base transition-all active:scale-95";
            dBtn.className = "flex-1 py-3 rounded-md border-2 border-slate-700 bg-slate-900 text-slate-400 font-bold text-base transition-all active:scale-95";
            
            if(status === 'Wet') wBtn.className = "flex-1 py-3 rounded-md border-2 border-cyan-500 bg-cyan-900/40 text-cyan-300 font-bold text-base transition-all shadow-inner active:scale-95";
            if(status === 'Dirty') dBtn.className = "flex-1 py-3 rounded-md border-2 border-amber-600 bg-amber-900/40 text-amber-400 font-bold text-base transition-all shadow-inner active:scale-95";
        }

        // Form Submit & Save
        function saveLog(e) {
            e.preventDefault();
            
            let details = "";
            
            if (state.actionType === 'feed') {
                const amt = document.getElementById('feed-amount').value;
                details = `${amt} oz`;
                state.lastFeedAmt = amt; // Persist
            } 
            else if (state.actionType === 'diaper') {
                const stat = document.getElementById('diaper-status').value;
                if(!stat) return; // Prevent empty diaper logs
                details = stat;
            } 
            else if (state.actionType === 'med') {
                const amt = document.getElementById('med-amount').value;
                const unit = document.getElementById('med-unit').value;
                const type = document.getElementById('med-type').value.trim();
                
                if(!type) return; // Need a med name
                details = `${amt} ${unit} - ${type}`;
                
                // Persist
                state.lastMedAmt = amt;
                state.lastMedUnit = unit;
                state.lastMedType = type;
            }

            // Convert native 24h time to 12h AM/PM for display
            const timeRaw = document.getElementById('log-time').value;
            let timeFmt = timeRaw;
            if (timeRaw) {
                const [h, m] = timeRaw.split(':');
                let hNum = parseInt(h);
                const ampm = hNum >= 12 ? 'PM' : 'AM';
                hNum = hNum % 12 || 12;
                timeFmt = `${hNum}:${m} ${ampm}`;
            }

            state.logs.unshift({
                id: Date.now(),
                twin: state.targetTwin,
                action: state.actionType,
                details: details,
                time: timeFmt,
                notes: document.getElementById('log-notes').value
            });

            // Cleanup & Save
            document.getElementById('log-notes').value = ""; // Only clear notes
            setDiaper(''); // Reset diaper selection visually
            document.getElementById('diaper-status').value = "";
            
            toggleLogForm(); // Collapse form
            saveData(); // Save to local storage and re-render
        }

        function startDictation(inputId) {
            if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();

                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "en-US";
                
                const dictModal = document.getElementById('dictationModal');
                const targetInput = document.getElementById(inputId);

                recognition.onstart = function() { dictModal.classList.remove('hidden'); };

                recognition.onresult = function(e) {
                    const transcript = e.results[0][0].transcript;
                    const existing = targetInput.value;
                    targetInput.value = existing ? existing + " " + transcript : transcript;
                    recognition.stop();
                };

                recognition.onerror = function(e) {
                    recognition.stop();
                    console.log("Speech Error: " + e.error); // Silent fail to user, just close modal
                };
                
                recognition.onend = function() { dictModal.classList.add('hidden'); };
                recognition.start();
            } else {
                console.log("Voice dictation is not supported in this browser.");
            }
        }

        function clearLogs() {
            state.logs = [];
            saveData();
            closeModal('clearLogsModal');
        }

        function renderLogs() {
            const container = document.getElementById('logs-container');
            if (state.logs.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 text-sm py-6 italic border-2 border-dashed border-slate-800 rounded-lg">No activity recorded today. Logs will appear here.</div>';
                return;
            }

            container.innerHTML = state.logs.map(l => {
                // Strict Colors Requirement applied to logs
                let borderClass = "";
                let nameColor = "";
                
                if (l.twin === 'Eloise') { 
                    borderClass = "border-l-4 border-l-purple-500"; 
                    nameColor = "text-purple-400"; 
                } else if (l.twin === 'Amelia') { 
                    borderClass = "border-l-4 border-l-green-500"; 
                    nameColor = "text-green-400"; 
                } else { 
                    borderClass = "border-l-4 border-l-transparent border-gradient-both"; 
                    nameColor = "text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-green-400"; 
                }
                
                // Icon Matching
                let iconHTML = "";
                if(l.action === 'feed') iconHTML = '<i class="fa-solid fa-bottle-droplet text-blue-400 text-lg"></i>';
                else if(l.action === 'diaper') iconHTML = '<i class="fa-solid fa-baby-carriage text-amber-400 text-lg"></i>';
                else if(l.action === 'med') iconHTML = '<i class="fa-solid fa-pills text-emerald-400 text-lg"></i>';

                return `
                <div class="bg-slate-950 p-3 rounded-r-lg border-t border-r border-b border-slate-800 shadow-sm flex flex-col ${borderClass}">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-bold text-base tracking-wide ${nameColor}">${l.twin}</div>
                            <div class="text-white text-base font-semibold mt-0.5">${l.details}</div>
                        </div>
                        <div class="flex flex-col items-end gap-1.5">
                            <span class="text-xs text-slate-400 font-bold">${l.time}</span>
                            ${iconHTML}
                        </div>
                    </div>
                    ${l.notes ? `<div class="text-sm text-slate-400 mt-2 italic bg-slate-900 p-2 rounded-md border border-slate-800 shadow-inner"><i class="fa-solid fa-quote-left text-slate-600 mr-2"></i>${l.notes}</div>` : ''}
                </div>
                `;
            }).join('');
        }

        // Modal Utilities
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
